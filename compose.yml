services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATA_DIR: /app/.data
      QDRANT_URL: http://qdrant:6333
    volumes: ["library:/app/.data"]
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes: ["vectors:/qdrant/storage"]
volumes:
  library:
  vectors:
