[project]
name = "evidence-rag"
version = "0.1.0"
description = "Local-first technical documentation Q&A with inspectable evidence"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20", "pydantic-settings>=2.8,<3", "qdrant-client>=1.14,<2", "rank-bm25>=0.2.2,<1", "pypdf>=5,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".data", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
